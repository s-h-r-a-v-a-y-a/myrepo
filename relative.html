<!DOCTYPE html>
<html>

<head>
    <style>
        .relative {
            position: relative;

        }

        .absolute {
            position: absolute;

        }
    </style>
</head>

<body>

    <div class="relative">
        <div>
            <img src="https://dummyimage.com/600x400/000/fff">
        </div>

        <div style="border:2px solid; width:50px;" class="absolute">
            <img src="https://images.theplantic.com/ProductImage/WebP/_t_16427886891_p_.webp" width="50px"
                height="50px">
        </div>
    </div>


    <div>
        <img src="https://dummyimage.com/600x400/000/fff">
    </div>



</body>

</html>
