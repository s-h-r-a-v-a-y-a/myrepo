<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

  <style>

.container{
  display: flex;
  justify-content: center;
  margin-top: 120px;
}

.card{
  background-color: aqua;
  color: black;
  padding: 20px 20px;
  border: 2px solid purple;
  margin-left: 12px;
  transition: width 20s;
}


.card.a:hover {
    background: aquamarine !important;
    top:2px;
    position: relative;

}

.card.b:hover {
    background: aquamarine !important;
    top:2px;
    position: relative;

}


.card.c:hover {
    background: aquamarine !important;
    top:2px;
    position: relative;

}
 
.card.d:hover {
    background: aquamarine !important;
    top:2px;
    position: relative;

}
 
  </style>

  <div class="container">

    <div class="card a">A</div>
    <div class="card b">B</div>
    <div class="card c">C</div>
    <div class="card d">D</div>
  </div>
  
</body>
</html>
